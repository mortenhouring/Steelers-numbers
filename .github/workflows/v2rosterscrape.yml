name: Update Roster

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-roster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Dump hydrated state with Puppeteer
        run: |
          # Install puppeteer for this step only (no package.json change)
          npm install puppeteer --no-save
          node scripts/puppeteer-dump.mjs "https://www.espn.com/nfl/player/_/id/4035687/michael-pittman-jr"

      - name: Commit puppeteer initial-state JSON to branch
        env:
          GIT_PUSH: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch-debug/puppeteer-initial-state.json || true
          git add fetch-debug/initial-state.raw.txt || true
          git add fetch-debug/espn-roster.html || true
          if ! git diff --cached --quiet; then
            git commit -m "debug: add puppeteer initial-state dump"
            git push
          else
            echo "No debug files to commit"
          fi

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run roster fetch (2026)
        run: node roster-fetch-2026.mjs

      - name: Commit and push new images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fetchimages/images/*.jpeg || true
          git add fetchimages/images/*.jpg || true
          git add fetchimages/images/*.png || true
          git add fetchimages/images/espn-images/*.png || true
          git add fetchimages/images/lazy-images/*.jpg || true
          git add fetchimages/images/lazy-images/*.png || true
          if ! git diff --cached --quiet; then
            git commit -m "Add fetched images"
            git push
          else
            echo "No new images to commit"
          fi

      - name: Commit roster.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add roster.json
          if ! git diff --cached --quiet; then
            git commit -m "Update roster.json"
            git push
          else
            echo "No changes to roster.json"
          fi
